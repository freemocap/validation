trial_path: sub-006/task-balance_trial-01

trackers:
- mediapipe
- vitpose
- rtmpose

pipeline:
- RMSEStep

ProjectConfig:
  qualisys_model_info_path: qualisys_markerset/qualisys_model_info.yaml
  conditions:
    eyes_open_solid:
      frames: [1600, 3200]
      label: "Eyes Open/Solid Ground"
    eyes_closed_solid:
      frames: [3950, 5550]
      label: "Eyes Closed/Solid Ground"
    eyes_open_foam:
      frames: [6600, 8200]
      label: "Eyes Open/Foam"
    eyes_closed_foam:
      frames: [8900, 10500]
      label: "Eyes Closed/Foam"
  sampling_rate: 30.0


TemporalAlignmentStep:
  start_frame: none
  end_frame: none
  qualisys_joint_weights_file: qualisys_joint_weights/validation_study_weights.yaml

SpatialAlignmentStep:
  markers_for_alignment:
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_hip
  - right_hip
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle
  - left_heel
  - right_heel
  - left_foot_index
  - right_foot_index
  frames_to_sample: 20
  max_iterations: 100
  inlier_threshold: 40

RMSEStep:
  loop_over_conditions: true
  markers_for_comparison:
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_hip
  - right_hip
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle
  - left_heel
  - right_heel
  - left_foot_index
  - right_foot_index
