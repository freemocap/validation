[project]
name = "validation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kaleido==0.2.1",
    "numpy==1.26.2",
    "pandas==2.1.4",
    "pingouin>=0.6.1",
    "plotly==6.0.1",
    "pyarrow==19.0.1",
    "pydantic==2.7.4",
    "requests>=2.32",
    "pyyaml==6.0.2",
    "scipy==1.11.4",
    "skellyforge==2024.12.1009",
    "skellymodels",
    "spm1d>=0.4.53",
    "tabulate>=0.10.0",
]

[project.scripts]
validation = "validation.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "validation*",
    "database*",
    "plotting*",
]

[tool.uv.sources]
skellymodels = { git = "https://github.com/aaroncherian/skellymodels.git", rev = "validation-v1" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
